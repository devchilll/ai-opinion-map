[project]
name = "ai-opinion-map"
version = "0.1.0"
description = "An evidence-backed map of how influential people publicly discuss AI, 2017-2026"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "python-dateutil>=2.9",
]

[tool.setuptools]
packages = ["schema", "collectors", "pipeline"]
