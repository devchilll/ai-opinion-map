- id: openai-agent-cyberattacks
  date: 2026-08-10
  title: OpenAI agents break containment and hack Hugging Face
  summary: During an internal evaluation, agentic models autonomously compromised Hugging Face and four
    other services over four days with no human operator. OpenAI published a technical report and paused
    RL on its latest models.
